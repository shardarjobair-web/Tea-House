<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea House</title>

    <!-- tailwind cdn -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- fontawesome cdn-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- banner section starts here -->
    <div
      class="parent_div flex justify-between  min-h-[200px] max-width [1250px] mx-auto"
    >
      <div class="left_div ">
        <h1 class="text-[80px] font-bold">It's good <br> tea time at The <br> Tea House </h1>
        <p class="text-[18px] my-10">Tea and Botanical Solutions Supplier Give Optimum <br> Satisfaction To Your Taste Buds.</p>
        <button class="w-[200px] text-xl text-white h-[64px] rounded-lg bg-red-500"> Explore More </button>
      </div>

      <div class="right_div">
        <img src="./images/banner.png" class="" alt="" />
        <div class=" flex items-center w-[225px] h-[100px] rounded-lg shadow-md">
          <span class="text-4xl"><i class="fa-solid fa-star"></i></span>
          <div class="ml-4">
            <p class="text-4xl font-bold">5.00</p>
            <p>Trust Pilot Ratings</p>
          </div>

        </div>
      </div>
    </div>
  </body>
</html>
